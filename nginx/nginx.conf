worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;
    error_log  logs/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    upstream mini_seckill_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=80r/s;
    limit_req_zone $arg_skuId zone=sku_limit:10m rate=300r/s;

    server {
        listen 80;
        server_name localhost;

        location /api/seckill/order {
            limit_req zone=ip_limit burst=40 nodelay;
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3s;
            proxy_connect_timeout 1s;
        }

        location /api/ {
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            proxy_connect_timeout 1s;
        }
    }
}
