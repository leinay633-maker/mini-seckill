worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log logs/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 10000;

    upstream mini_seckill_backend {
        least_conn;
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8083 max_fails=3 fail_timeout=10s;
        keepalive 512;
    }

    limit_req_zone $binary_remote_addr zone=ip_limit:100m rate=500r/s;
    limit_req_zone $arg_skuId zone=sku_limit:100m rate=20000r/s;

    server {
        listen 80 reuseport backlog=65535;
        server_name localhost;

        location /api/seckill/token {
            limit_req zone=ip_limit burst=1000 nodelay;
            limit_req zone=sku_limit burst=5000 nodelay;
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 2s;
            proxy_connect_timeout 1s;
        }

        location /api/seckill/order {
            limit_req zone=ip_limit burst=1000 nodelay;
            limit_req zone=sku_limit burst=5000 nodelay;
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 2s;
            proxy_connect_timeout 1s;
        }

        location /api/ {
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            proxy_connect_timeout 1s;
        }
    }
}
