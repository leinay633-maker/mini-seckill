worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 10000;

    upstream mini_seckill_backend {
        least_conn;
        server app-1:8080 max_fails=3 fail_timeout=10s;
        server app-2:8080 max_fails=3 fail_timeout=10s;
        server app-3:8080 max_fails=3 fail_timeout=10s;
        server app-4:8080 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    limit_req_zone $binary_remote_addr zone=ip_limit:20m rate=200r/s;
    limit_req_zone $arg_skuId zone=sku_limit:20m rate=5000r/s;

    server {
        listen 80;
        server_name localhost;

        location = /actuator/health {
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/seckill/ {
            limit_req zone=ip_limit burst=500 nodelay;
            limit_req zone=sku_limit burst=1000 nodelay;
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            proxy_connect_timeout 2s;
        }

        location / {
            proxy_pass http://mini_seckill_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
            proxy_connect_timeout 2s;
        }
    }
}
