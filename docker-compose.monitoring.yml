services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: mini-seckill-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/mini-seckill-alerts.yml:/etc/prometheus/rules/mini-seckill-alerts.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mini-seckill-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/mini-seckill-dashboard.json:/var/lib/grafana/dashboards/mini-seckill-dashboard.json:ro
    depends_on:
      - prometheus
