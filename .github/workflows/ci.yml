name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven verification
        run: mvn -B clean verify

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.nginx.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.monitoring.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.nginx.yml -f docker-compose.monitoring.yml config --quiet

      - name: Check benchmark evidence files
        run: ./scripts/check-evidence.sh

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: target/site/jacoco/
          if-no-files-found: warn

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Testcontainers integration tests
        run: mvn -B clean -Pintegration-test verify

      - name: Assert integration tests were not skipped
        run: ./scripts/assert-integration-tests-ran.sh
