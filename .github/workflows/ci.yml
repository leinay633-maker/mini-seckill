name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive exact source inputs for reproducible correctness review
        run: |
          git archive --format=tar.gz --output=ci-source.tar.gz HEAD
          git rev-parse HEAD HEAD^{tree} > ci-source-identity.txt
          sha256sum ci-source.tar.gz > ci-source.tar.gz.sha256
      - name: Upload source inputs
        uses: actions/upload-artifact@v4
        with:
          name: source-inputs
          path: |
            ci-source.tar.gz
            ci-source-identity.txt
            ci-source.tar.gz.sha256
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test evidence checker negative cases
        run: python3 -m unittest discover -s scripts -p 'test_consistency_evidence.py' -v

      - name: Test native pool-budget benchmark orchestration and evidence
        run: python3 -m unittest discover -s scripts -p 'test_pool_budget_benchmark.py' -v

      - name: Run Maven verification
        run: mvn -B clean verify

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.nginx.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.monitoring.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.nginx.yml -f docker-compose.monitoring.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app-scale.yml -f docker-compose.nginx.yml -f docker-compose.monitoring.yml -f docker-compose.bench-limits.yml config --quiet

      - name: Check benchmark evidence files
        run: ./scripts/check-evidence.sh

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload unit test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Testcontainers verification and archive consistency evidence
        run: python3 scripts/run-consistency-evidence.py --output benchmark/results/consistency-ci

      - name: Assert integration tests were not skipped
        run: ./scripts/assert-integration-tests-ran.sh

      - name: Show build failure context
        if: failure()
        run: tail -n 160 benchmark/results/consistency-ci/maven.log || true

      - name: Upload consistency evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-evidence
          path: benchmark/results/consistency-ci/
          if-no-files-found: error
